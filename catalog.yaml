  # ---------------- Misc AI ----------------
  facct:     {subs: [MISC]}
  gecco:     {subs: [MISC]}
  cec:       {subs: [MISC], aliases: [ieeecec]}
  ppsn:      {subs: [MISC]}
  ictai:     {subs: [MISC]}
  cogsci:    {subs: [MISC]}
  icaif:     {subs: [MISC]}
  ismb:      {subs: [MISC]}
  recomb:    {subs: [MISC]}
